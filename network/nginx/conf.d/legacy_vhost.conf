# Legacy Insecure Payment Terminal Endpoint (Vulnerable by design for security scanner verification)
server {
    listen 8443 ssl;
    server_name legacy.nexis-core.finance;

    ssl_certificate /etc/ssl/certs/expired-cert.pem;
    ssl_certificate_key /etc/ssl/keys/expired-key.pem;

    # Insecure and deprecated protocol versions (triggers ECDAT-CRYPTO-007, ECDAT-CRYPTO-008)
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # Insecure ciphers containing obsolete algorithms (triggers ECDAT-CRYPTO-001, ECDAT-CRYPTO-004, ECDAT-CRYPTO-005)
    ssl_ciphers HIGH:!aNULL:MD5:RC4:3DES:DES-CBC3-SHA;
    ssl_prefer_server_ciphers off;

    location /legacy-pos/ {
        proxy_pass http://payment-py:8080;
    }
}

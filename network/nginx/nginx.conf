user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$ssl_protocol" "$ssl_cipher"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Global SSL defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Include modular virtual host configurations
    include /etc/nginx/conf.d/*.conf;

    # HTTP Ingress Gateway on Port 80
    server {
        listen 80 default_server;
        server_name _;

        location /healthz {
            return 200 '{"status":"healthy","service":"nginx-ingress","port":80}\n';
            add_header Content-Type application/json;
        }

        location / {
            return 200 '{"status":"running","ingress":"http","port":80,"services":{"https":443,"api_gateway":3030,"payment":8080,"vault":8200,"legacy_edge":8443}}\n';
            add_header Content-Type application/json;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name nexis-core.internal;

        ssl_certificate /etc/ssl/certs/edge-router.crt;
        ssl_certificate_key /etc/ssl/keys/edge-router.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /healthz {
            return 200 '{"status":"healthy","quantum_safe":true}';
            add_header Content-Type application/json;
        }
    }
}

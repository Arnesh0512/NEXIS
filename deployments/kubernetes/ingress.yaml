apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexis-edge-ingress
  namespace: nexis-core
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    kubernetes.io/tls-cert-file: "certificates/edge-router.crt"
    kubernetes.io/tls-key-file: "keys/edge-router.key"
spec:
  tls:
    - hosts:
        - api.nexis-core.finance
        - gateway.nexis-core.finance
      secretName: nexis-gateway-tls
  rules:
    - host: api.nexis-core.finance
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-router-service
                port:
                  number: 443

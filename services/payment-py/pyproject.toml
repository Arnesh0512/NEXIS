[tool.poetry]
name = "payment-py"
version = "2.1.0"
description = "Nexis Core Enterprise Payment Dispatcher and PCI-DSS Tokenization Service"
authors = ["Nexis Security Team <security@nexis.io>"]

[tool.poetry.dependencies]
python = "^3.11"
cryptography = "^42.0.5"
pycryptodome = "^3.20.0"
paramiko = "^3.4.0"
bcrypt = "^4.1.2"
pydantic = "^2.6.4"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

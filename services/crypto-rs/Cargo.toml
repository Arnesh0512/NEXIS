[package]
name = "crypto-rs"
version = "0.4.0"
edition = "2021"
authors = ["Nexis Security Team <security@nexis.io>"]
description = "Nexis Core Cryptographic Storage Engine and Post-Quantum Hardware Accelerator"

[dependencies]
# 1. Ring Cryptography
ring = "0.17.8"

# 2. RustCrypto AES-GCM
aes-gcm = "0.10.3"

# 3. Post-Quantum Kyber (ML-KEM)
pqcrypto-kyber = "0.8.0"
pqcrypto-traits = "0.3.5"

# 4. JSON Web Tokens
jsonwebtoken = "9.3.0"

# 5. BCrypt Password Hasher
bcrypt = "0.15.1"

# 6. Reqwest HTTP Client
reqwest = { version = "0.12.4", features = ["json"], default-features = false }

# 7. Actix Web Framework
actix-web = "4.6.0"

# 8. Tokio Async Runtime
tokio = { version = "1.37.0", features = ["rt", "macros", "sync"] }

# 9. MongoDB Database Driver
mongodb = { version = "2.8.2", default-features = false }

# 10. MySQL Database Driver
mysql = "24.0.0"

# 11. PostgreSQL Database Driver
postgres = "0.19.7"

# 12. Redis Client
redis = "0.25.3"

# 13. OpenAI SDK
async-openai = "0.20.0"

# 14. Google Cloud Storage
google-cloud-storage = "1.20.0"

# 15. HTML Scraper & Parser
scraper = "0.19.0"

# Serialization and Utilities
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0.117"
hex = "0.4.3"
thiserror = "1.0.60"
log = "0.4.21"
chrono = "0.4.38"